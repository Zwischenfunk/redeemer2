services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    Doctrine\DBAL\Connection:
        factory: ['App\Infrastructure\DatabaseConnectionFactory', 'create']
        arguments: ['%env(DATABASE_URL)%']
        lazy: true
        public: true

    Symfony\Component\Ldap\Ldap:
        factory: ['Symfony\Component\Ldap\Ldap', 'create']
        arguments:
            - ext_ldap
            -
                connection_string: '%env(LDAP_URI)%'
                version: 3
                encryption: '%env(LDAP_ENCRYPTION)%'
        public: true
