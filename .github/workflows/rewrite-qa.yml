name: Rewrite QA

on:
  pull_request:
  push:
    branches: [main]
  # Reusable by the release workflow (issue 9/10) without publishing anything itself.
  workflow_call:

# Read-only by default; PR code gets no publication rights and no secrets.
permissions:
  contents: read

concurrency:
  group: rewrite-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, PHPStan, composer validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: make rewrite-lint
        run: make rewrite-lint
      - name: Reproduce locally
        if: failure()
        run: echo "::error::Static checks failed. Reproduce with 'make rewrite-lint'."

  audit:
    name: Dependency audit (composer.lock)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: make rewrite-audit
        run: make rewrite-audit
      - name: Reproduce locally
        if: failure()
        run: echo "::error::Audit failed. Reproduce with 'make rewrite-audit'."

  test:
    name: PHPUnit on the synthetic stack (DB, LDAP, Mailpit, nginx)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: make rewrite-test
        run: make rewrite-test
      - name: Stack logs
        if: failure()
        run: docker compose -p redeemer-rewrite -f compose.rewrite.yaml --profile tools logs --no-color --tail=200
      - name: Reproduce locally
        if: failure()
        run: echo "::error::Tests failed. Reproduce with 'make rewrite-test' (see app/docs/teststack.md)."
      - name: Tear down
        if: always()
        run: make rewrite-down
