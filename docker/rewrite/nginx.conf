user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /dev/stdout;

    # Application below /wien/. Only app/public is mounted into this container:
    # config, src, templates and vendor are not part of the HTTP tree.
    server {
        listen 80;
        server_name _;
        root /srv/app/public;

        location = / {
            return 302 /wien/;
        }

        location = /wien {
            return 301 /wien/;
        }

        location /wien/assets/ {
            alias /srv/app/public/assets/;
            try_files $uri =404;
        }

        # Only the exact legacy browser alias is routed, never a PHP path suffix.
        location ~ ^/wien/index\.php. {
            return 404;
        }

        location /wien/ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /srv/app/public/index.php;
            fastcgi_param SCRIPT_NAME /wien/index.php;
            fastcgi_param DOCUMENT_ROOT /srv/app/public;
            fastcgi_pass php:9000;
        }

        location / {
            return 404;
        }
    }

    # Mailpit web UI; the mail container itself is not attached to a routable network.
    server {
        listen 8025;
        server_name _;

        location / {
            proxy_pass http://mail:8025;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
